# Explicit production overlay: docker compose -f compose.yaml -f compose.postgres.yaml ...
# Preserve a site's private override as the LAST -f argument.
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 24
  migrate:
    depends_on:
      postgres: {condition: service_healthy}
  web:
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    depends_on:
      postgres: {condition: service_healthy}
  events:
    depends_on:
      postgres: {condition: service_healthy}
  keepalive:
    depends_on:
      postgres: {condition: service_healthy}
  maintenance:
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres-data:
