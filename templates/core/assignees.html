<span class="assignee-list">{% for person in pr.assignees.all %}<a class="assignee-chip" href="{% url 'dashboard' %}?assignee={{ person.github_id }}"><span class="avatar"><span aria-hidden="true">{{ person.login|slice:':1'|upper }}</span><img src="{{ person.avatar_url }}" alt="" width="28" height="28" loading="lazy" referrerpolicy="no-referrer"></span><span>{{ person.login }}</span></a>{% empty %}<span class="muted">{% if pr.assignees_synced_at %}Unassigned{% else %}Not synced yet{% endif %}</span>{% endfor %}</span>
